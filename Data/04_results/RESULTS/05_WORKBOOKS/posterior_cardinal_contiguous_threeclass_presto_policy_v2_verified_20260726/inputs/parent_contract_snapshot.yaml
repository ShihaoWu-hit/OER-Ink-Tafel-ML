inner_validation:
  reuse_parent_manifest_exactly: true
  folds: 4
  expected_manifest_sha256: 603e5daa6432cd8115a6c461004b6774838ef770ddacb3afb4f91ebd8db7fc2f
  grouping: identical_to_outer_connected_groups
  fit_feature_engineering_inside_each_inner_training_fold: true
  penalty_selection_primary_metric: high_gate_soft_bernoulli_cross_entropy
  penalty_selection_secondary_tiebreaks:
    - full_threeclass_soft_log_loss
    - high_gate_brier
    - larger_penalty
  hard_labels_or_recall_used_for_probability_model_selection: false

model:
  estimator_id: presto_high_gate_direct_gower_conditional
  exact_presto_replication: false
  model_name: PRESTO-inspired_fused_continuation_ratio_soft_label_gate
  ordered_transition_definitions:
    transition_1: P_120_or_high_given_X
    transition_2: P_high_given_120_or_high_and_X
  ordinal_parameterization: forward_continuation_ratio
  class_probability_mapping:
    low: one_minus_transition_1
    120: transition_1_times_one_minus_transition_2
    high: transition_1_times_transition_2
  feature_input: single_x_only_gower_novelty_score
  fold_local_gower_novelty:
    panel: context_plus_polarity
    neighbors: 5
    aggregation: arithmetic_mean_of_five_smallest_distances
    training_record_distance_excludes_same_connected_group: true
    numeric_and_categorical_gower_blocks: inherited_fold_local_panel_blocks
    selected_after_closed_data_development_probe: true
    feature_effect_interpretation_allowed: false
  penalty:
    form: smooth_l1_beta1_plus_smooth_l1_beta2_minus_beta1
    l1_smoothing: 0.000001
    ridge_stabilizer: 0.000001
    intercept_penalized: false
  penalty_grid: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0]
  optimizer:
    method: scipy_L-BFGS-B
    maximum_iterations: 2000
    tolerance: 0.000000001
    finite_nonconverged_solution_accepted: false
    all_candidates_failed_action: fail_closed
  hybrid:
    high_probability_source: PRESTO_inspired_unconditional_high_probability
    low_vs_120_conditional_source: immutable_direct_multiscale_soft_gower
    direct_gower_conditional_refitted_in_inner_folds_for_policy_comparator: true
  declared_deviations_from_faletto_bien_2023:
    - continuation_ratio_instead_of_nonparallel_cumulative_odds
    - smooth_l1_instead_of_exact_l1
    - posterior_soft_label_extension
    - fixed_small_ridge_stabilizer
    - x_only_gower_novelty_coordinate
  deviations_rationale: prevent_crossed_boundaries_and_negative_middle_class_probabilities

high_recall_policy:
  role: separate_cost_sensitive_decision_layer_not_probability_recalibration
  threshold_grid: [0.03, 0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25, 0.275, 0.30, 0.35, 0.40, 0.50, 0.75, 1.00]
  selection_target: posterior_soft_high_mass
  selection_utility: soft_f2
  expected_fpr_cap: 0.20
  tiebreaks:
    - higher_soft_high_recall
    - lower_soft_high_false_positive_rate
    - higher_threshold
  selected_only_from_outer_training_grouped_inner_oof: true
  baseline_receives_identical_protocol: true
  baseline: direct_multiscale_soft_gower
  prediction_rule:
    high: high_probability_at_or_above_selected_threshold
    otherwise: argmax_low_vs_120_probability
  repeated_record_aggregation:
    high: at_least_half_of_repeat_votes
    otherwise: argmax_mean_low_vs_120_probability
  required_joint_reporting:
    - default_argmax_high_recall
    - policy_high_recall
    - high_precision
    - high_false_positive_rate
    - predicted_high_count
    - overall_accuracy
    - balanced_accuracy
    - macro_f1
    - posterior_expected_accuracy
    - full_soft_log_loss

comparators:
  immutable_direct_multiscale_soft_gower:
    probability_source: parent_oof_probabilities
    policy_threshold_refit_source: grouped_inner_oof
    identical_recall_policy_utility: true
  fold_local_threeclass_soft_prior:
    recomputed_in_every_outer_training_fold: true

metrics:
