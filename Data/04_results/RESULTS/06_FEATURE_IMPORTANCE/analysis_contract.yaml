  - Marginal permutation can create uncommon feature combinations and does not identify unique conditional information.
  - Gower context and singleton formulation blocks are equally weighted; importance includes that frozen design choice.
  - The closed-data PRESTO policy-v2 rule was globally post-selected, so bootstrap intervals are conditional and not independent confirmation.
