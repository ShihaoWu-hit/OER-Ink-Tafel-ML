    selection_policy: fixed_context_plus_one_target_blind
    one_feature_per_augmented_panel: true
    outcome_driven_feature_selection_used: false
    composition_property_coordinates_never_cooccur: true
    hard_exclusions:
      - catalyst_support
      - ionomer_concentration_wt_percent
      - conductive_agent_dose_mg_per_mgcat
      - electrolyte_identity
      - dispersion_method
      - sonication_time_min
      - drop_volume_uL
