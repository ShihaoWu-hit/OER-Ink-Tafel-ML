  hard_labels_or_hard_metrics_used_for_fit: false

model:
  estimator_id: shrunk_calibrated_direct_multiscale_soft_gower
  base_estimator_id: direct_multiscale_soft_gower
  feature_panel: context_plus_ionomer_ratio
  gower:
    inherited_from_parent_without_change: true
    neighbor_mode: knn
    n_neighbors: [9, 15, 21, 25, 31, 40]
    distance_power: 1.0
    epsilon: 1.0e-12
  multiscale_weights:
    fit_source: grouped_inner_oof_component_probabilities
    constraint: nonnegative_simplex
    identity: equal_weights
    objective: fold_equal_mean_soft_cross_entropy_plus_lambda_times_squared_distance_from_equal_weights
    shrinkage_lambda: 16.0
    optimizer: scipy_SLSQP
    maximum_iterations: 500
    tolerance: 0.000000000001
    failure_or_worse_raw_inner_loss_action: equal_weight_fallback
  calibration:
    form: identity_shrunk_shared_log_probability_slope_plus_sum_to_zero_class_intercepts
    mapping: softmax(a_times_log_probability_plus_b)
    free_parameters: 3
    identity_parameters: [1.0, 0.0, 0.0]
    intercept_parameterization: [b0, b1, negative_b0_minus_b1]
    objective: fold_equal_mean_soft_cross_entropy_plus_lambda_times_squared_distance_from_identity
    shrinkage_lambda: 0.25
    slope_bounds: [0.5, 1.5]
    free_intercept_bounds: [-0.5, 0.5]
    optimizer: scipy_L-BFGS-B
    maximum_iterations: 500
    tolerance: 0.000000000001
    failure_or_worse_raw_inner_loss_action: identity_calibration_fallback
  probability_clip_epsilon: 0.000000000000001
  outer_prediction:
    component_source: immutable_parent_outer_component_oof_probabilities
    component_soft_labels_or_outer_metrics_available_to_fit: false
    apply_outer_training_inner_oof_weights_and_calibration_only: true

comparators:
