inherited_probability_model:
  evaluation_model: presto_high_gate_direct_gower_conditional
  source: immutable_parent_analyses_oof_probabilities
  probability_refit_or_recalibration: forbidden
  probability_values_must_match_parent_exactly: true
  full_run_oof_csv_must_be_byte_identical_to_parent: true
  probability_metrics_are_inherited_not_a_new_claim: true
  soft_log_loss_and_brier_are_not_changed_by_policy: true

label_scheme:
  inherited_from_parent_without_change: true
  supervised_class_order: [low_60_side, 120_side, high_off]
  soft_label_columns: [q_low_60_side, q_120_side, q_high_off]
  prediction_columns: [p_low_60_side, p_120_side, p_high_off]
  posterior_argmax_training_or_policy_selection_use: forbidden

validation:
  outer_manifest_reused_exactly: true
  outer_folds: 5
  outer_repeats: 10
  inner_manifest_reused_exactly: true
  inner_folds: 4
  grouping: publication_verified_laboratory_recipe_hash_connected_components
  outer_test_used_for_penalty_threshold_or_aggregation_selection: false
  aggregate_repeated_oof_by_record_before_inference: true

policy_score_model:
  estimator: presto_inspired_fused_continuation_ratio_policy_only_score
  exact_presto_replication: false
  preserved_parent_deviations_from_exact_presto:
    - continuation_ratio_instead_of_nonparallel_cumulative_odds
    - smooth_l1_instead_of_exact_l1
    - posterior_soft_label_extension
    - fixed_small_ridge_stabilizer
    - x_only_gower_novelty_coordinate
  probability_model_role: none
  feature_input: inherited_fold_local_context_plus_polarity_gower_novelty
  policy_penalty_grid: [0.003, 0.01, 0.03]
  source_candidates: immutable_parent_grouped_inner_oof_presto_candidates
  outer_refit_uses_parent_v1_presto_implementation: true
  non_high_decision_source: inherited_parent_hybrid_low_vs_120_probabilities

inner_policy_selection:
  threshold_grid: [0.03, 0.05, 0.075, 0.10, 0.125, 0.15, 0.175, 0.20, 0.225, 0.25, 0.275, 0.30, 0.35, 0.40, 0.50, 0.75, 1.00]
  expected_soft_fpr_cap: 0.20
  utility: soft_f_beta
  beta: 0.5
  weights: equal_inner_fold_then_equal_record_within_fold
  joint_penalty_threshold_selection: true
  tiebreaks:
    - higher_soft_high_recall
    - lower_soft_high_false_positive_rate
    - higher_threshold
    - larger_penalty
  selected_only_from_outer_training_grouped_inner_oof: true
  hard_outer_labels_used: false

repeat_aggregation:
  primary:
    rule: high_if_mean_raw_score_minus_selected_threshold_is_nonnegative
    margin: policy_high_score_minus_inner_selected_threshold
    otherwise: argmax_mean_inherited_low_vs_120_probabilities
  sensitivities:
    - high_if_at_least_5_of_10_repeat_votes
    - high_if_at_least_6_of_10_repeat_votes
  aggregation_rule_selected_after_closed_outer_results_seen: true

metrics:
  inherited_probability:
    - full_coverage_three_class_soft_log_loss
    - multiclass_brier
  policy:
    - modal_accuracy
    - balanced_accuracy
    - macro_f1
    - posterior_expected_hard_accuracy
    - modal_high_recall
    - modal_high_precision
    - modal_high_false_positive_rate
    - posterior_expected_high_recall
    - posterior_expected_high_precision
    - posterior_expected_high_false_positive_rate
    - predicted_high_count
  probability_and_policy_metrics_must_not_be_conflated: true

connected_group_inference:
  bootstrap_repetitions: 2000
  bootstrap_seed: 20260726
  unit: connected_group
  aggregate_repeated_oof_before_resampling: true
  paired_comparator: parent_v1_presto_soft_f2_majority_vote_policy
  global_policy_selection_not_covered_by_conditional_bootstrap: true

development_boundary:
  method_sources:
    - https://proceedings.mlr.press/v202/faletto23a.html
    - https://doi.org/10.1186/1471-2105-7-91
  f0_5_utility_and_mean_margin_rule_selected_after_inspecting_closed_outer_results: true
  nested_outer_cv_does_not_cover_global_method_selection: true
  paired_bootstrap_is_conditional_on_selected_rule: true
  independent_confirmation_requires_future_precommitted_data_or_evaluation: true
  closed_dataset_has_no_independent_confirmation_set: true
  result_is_post_selection_development_evidence: true
