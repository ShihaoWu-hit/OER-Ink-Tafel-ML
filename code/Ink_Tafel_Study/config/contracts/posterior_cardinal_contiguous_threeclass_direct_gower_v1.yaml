model:
  estimator_id: direct_multiscale_soft_gower
  response: complete_three_class_soft_probability_vector
  architecture: direct_label_distribution_smoother
  feature_panel: context_plus_ionomer_ratio
  panel_choice_basis: recurring_parent_inner_selection_then_posthoc_development
  feature_engineering:
    source_registry: inherited_parent_hash_bound_reduced_feature_registry
    rare_min_frequency: 3
    fitted_on_outer_training_records_only: true
    transformed_test_records_never_refit_preprocessing: true
  gower:
    numeric_and_categorical_mixed_distance: true
    blocks: inherited_fold_local_panel_blocks
    block_weights: equal
    feature_weights: equal_within_block
    neighbor_mode: knn
    n_neighbors: [9, 15, 21, 25, 31, 40]
    distance_power: 1.0
    epsilon: 1.0e-12
    exact_and_kth_distance_ties: include_all
  multiscale_aggregation:
    rule: arithmetic_mean_probability_vectors
    weights: [0.16666666666666666, 0.16666666666666666, 0.16666666666666666, 0.16666666666666666, 0.16666666666666666, 0.16666666666666666]
    selected_or_tuned_on_outer_test: false
  additional_prior_shrinkage:
    enabled: false
    rationale: each_neighbor_prediction_is_already_a_convex_training_soft_label_smoother
  optuna:
    enabled: false
    rationale: fixed_multiscale_average_reduces_small_inner_fold_winner_variance

comparators:
