[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tafel-refit"
version = "0.4.0"
description = "Auditable OER Tafel-curve refitting with paper-compatible and potential-dependent models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arviz==0.23.4",
  "matplotlib==3.11.0",
  "numpy==2.4.2",
  "openpyxl==3.1.5",
  "pandas==3.0.3",
  "pymc==5.28.5",
  "scipy==1.18.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel==7.2.0",
  "nbclient==0.10.2",
  "nbformat==5.10.4",
  "pytest==9.1.1",
]

[project.scripts]
tafel-refit = "tafel_refit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tafel_refit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
